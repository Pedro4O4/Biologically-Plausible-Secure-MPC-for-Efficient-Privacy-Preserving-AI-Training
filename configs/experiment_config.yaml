# ============================================================
# Experiment Config — Phase 0: Scope Locking
# Topic II: Biologically Plausible Secure MPC for SNN Training
# ============================================================
# This file is the single source of truth for architecture
# and simulation parameters. Nothing below should be hard-coded
# again inside the model/training scripts.

architecture:
  num_inputs: 784      # 28x28 MNIST pixels, flattened. Fixed by the dataset.
  num_hidden: 100       # LIF neurons in the hidden (STDP-learned) layer.
  num_outputs: 10       # 10 digit classes (0-9). Fixed by the task.

simulation:
  # Fixed number of timesteps every sample is run for, regardless of
  # the image's content. Must NEVER depend on input data (see note below).
  num_steps: 25

encoding:
  method: "rate"   # Pixel intensity -> spike probability per timestep.

# ------------------------------------------------------------
# Phase 1: plaintext ANN baseline (backpropagation)
# ------------------------------------------------------------
seed: 0                # Same seed for data split and weight init, so runs repeat.

data:
  num_train: 5000      # Images used for training (taken from the MNIST train set).
  num_val: 1000        # Images for validation (also from the train set, never overlapping).
  # Test set = the full official 10,000-image MNIST test set, untouched until the end.

ann:
  # Architecture reuses architecture.* above: 784 -> hidden (ReLU) -> 10.
  optimizer: "adam"
  lr: 0.001
  batch_size: 64
  epochs: 20

# ------------------------------------------------------------
# Phase 2: LIF hidden layer (forward pass only, no learning yet)
# ------------------------------------------------------------
neuron:
  beta: 0.9            # Leak: the membrane keeps 90% of its value each timestep.
  threshold: 50.0      # A neuron spikes when its membrane potential reaches this.
  reset: "subtract"    # After a spike: u = u - threshold ("zero" would set u = 0).
  w_norm: 78.4         # Random initial weights: each neuron's incoming weights sum to this.

# ------------------------------------------------------------
# Phase 3: STDP learning (unsupervised, local, no labels)
# ------------------------------------------------------------
learning:
  threshold: 15.0      # Base threshold while learning (neuron.threshold is only for Phase 2).
  wta: true            # Winner-take-all: at most one hidden spike per timestep.
  lr: 0.02             # STDP step size.
  trace_decay: 0.8     # Input trace keeps 80% of its value each timestep.
  x_target: 2.0        # Trace level where a post spike changes nothing.
  w_max: 1.0           # Upper bound used by the soft-bound term.
  mu: 1.0              # Soft-bound exponent.
  theta_plus: 0.5      # Threshold bonus a neuron gets each time it wins.
  epochs: 1            # Passes over the training images (data.num_train of them).

# ------------------------------------------------------------
# Phase 4: supervised readout on the STDP hidden spike counts
# ------------------------------------------------------------
readout:
  epochs: 300          # Full-batch Adam steps (the hidden layer stays frozen).
  lr: 0.05
  record_every: 10     # How often the convergence curve gets a point.
